<svg xmlns="http://www.w3.org/2000/svg" width="780" height="190" viewBox="0 0 780 190" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12">
<rect width="780" height="190" fill="#fff"/>
<text x="10" y="20" font-size="13.5" font-weight="600" fill="#1a202c">Share of visits that met someone, by dwell band</text>
<text x="10" y="55" fill="#2d3748">&lt;1 min</text>
<rect x="320" y="45" width="1.0" height="13" rx="2" fill="#2f855a" opacity="0.87"/>
<text x="328" y="55" fill="#1a202c" font-weight="600">0%</text>
<text x="10" y="81" fill="#2d3748">1–3 min</text>
<rect x="320" y="71" width="8.9" height="13" rx="2" fill="#2f855a" opacity="0.87"/>
<text x="336" y="81" fill="#1a202c" font-weight="600">2%</text>
<text x="10" y="107" fill="#2d3748">3–10 min</text>
<rect x="320" y="97" width="226.8" height="13" rx="2" fill="#2f855a" opacity="0.87"/>
<text x="554" y="107" fill="#1a202c" font-weight="600">60%</text>
<text x="10" y="133" fill="#2d3748">10–25 min</text>
<rect x="320" y="123" width="380.0" height="13" rx="2" fill="#2f855a" opacity="0.87"/>
<text x="707" y="133" fill="#1a202c" font-weight="600">100%</text>
<text x="10" y="160" fill="#718096" font-size="11.5">Nearly deterministic: a SYNTHETIC-GENERATOR artefact — mechanisms are real, magnitudes are not.</text>
</svg>